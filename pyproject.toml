[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parachron"
version = "5.2.2"
description = "Parallel-in-time N-body integration (mean-element parareal), based on REBOUND"
readme = { file = "README.md", content-type = "text/markdown" }
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# Parachron is a modified version of REBOUND by Hanno Rein and contributors (https://github.com/hannorein/rebound)
authors = [
    { name = "Hanno Rein", email = "hanno@hanno-rein.de" },
    { name = "Michael Hippke" },
]
keywords = [
    "astronomy",
    "astrophysics",
    "nbody",
    "integrator",
    "symplectic",
    "wisdom-holman",
    "parareal",
    "parallel-in-time",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/hippke/parachron"
Upstream = "https://github.com/hannorein/rebound"

[tool.setuptools.packages.find]
include = ["rebound*"]
exclude = ["reboundx*","utsc_nfs*"]

[tool.setuptools.package-data]
rebound = ["../src/*.h"]

[tool.cibuildwheel.windows]
environment = { CC = "clang-cl" }
