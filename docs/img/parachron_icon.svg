<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Parachron icon">
  <title>Parachron icon</title>
  <!-- Alternative: the pipelined schedule of one window (slices start one coarse hop apart and run in parallel),
       framed by an orbit. -->
  <rect width="200" height="200" rx="36" fill="#14213d"/>
  <g stroke-linecap="round" stroke-width="12">
    <line x1="46"  y1="62"  x2="104" y2="62"  stroke="#3f88c5"/>
    <line x1="60"  y1="86"  x2="122" y2="86"  stroke="#5aa0d6"/>
    <line x1="74"  y1="110" x2="140" y2="110" stroke="#e0a03a"/>
    <line x1="88"  y1="134" x2="156" y2="134" stroke="#e07a2f"/>
  </g>
  <!-- the coarse chain linking the slices -->
  <polyline points="40,50 54,74 68,98 82,122 96,146" fill="none" stroke="#f2b632" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round"/>
  <ellipse cx="100" cy="100" rx="84" ry="56" transform="rotate(-20 100 100)" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>
  <circle cx="154.3" cy="46.6" r="7" fill="#f2b632"/>
</svg>
